[project]
name = "blackjack-sim"
version = "0.1.0"
description = "CLI simplified Blackjack with a multi-agent AI crew (LangChain)."
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.2.76",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.3.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "openai>=1.0",
    "pytest>=8.0",
    "python-dotenv>=1.0",
]

[project.scripts]
blackjack-sim = "app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: live OpenAI HTTP; requires OPENAI_API_KEY (see .env.example)",
]

# Help editors / basedpyright resolve langchain/langgraph from the project venv.
[tool.pyright]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
extraPaths = [".venv/lib/python3.12/site-packages"]
